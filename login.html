<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dent Clinica Dental | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    }
    .login-card {
      box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.14), 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    }
    .line-title {
      display: flex;
      align-items: center;
      text-align: center;
    }
    .line-title::before,
    .line-title::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #cbd5e1;
    }
    .line-title:not(:empty)::before { margin-right: .85em; }
    .line-title:not(:empty)::after { margin-left: .85em; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 text-slate-700 antialiased">

  <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200/90 p-8 login-card text-center">
    <div class="mb-6 flex justify-center">
      <img src="assets/DentLabLogo.jpeg" alt="Grupo Medico Dent" class="w-16 h-16 rounded-full object-cover border-2 border-slate-200 shadow-sm">
    </div>

    <h1 class="line-title text-xl font-bold tracking-tight text-slate-800 mb-7">
      Grupo Medico Dent
    </h1>

    <form onsubmit="IniciaSesion(event)" class="space-y-4">
      <div>
        <input
          type="text"
          id="usuario"
          value="user"
          required
          placeholder="Usuario"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50/70 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-[#40C1CA] focus:ring-2 focus:ring-[#40C1CA]/20 transition-all"
        />
      </div>

      <div>
        <input
          type="password"
          id="clave"
          value="123"
          required
          placeholder="Clave"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50/70 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-[#40C1CA] focus:ring-2 focus:ring-[#40C1CA]/20 transition-all"
        />
      </div>

      <div class="pt-1">
        <button
          type="submit"
          id="btnLogin"
          class="w-full py-2.5 px-5 rounded-lg bg-[#2A3F54] hover:bg-[#1f3041] text-white font-semibold text-sm shadow-sm transition-all cursor-pointer"
        >
          Iniciar sesión
        </button>
      </div>

      <div class="pt-6 mt-6 border-t border-slate-200 text-xs text-slate-500 space-y-1">
        <p>©2026 Todos los derechos reservados.</p>
        <a href="http://www.resosistemas.mx/" target="_blank" class="text-[#2A3F54] hover:underline font-semibold inline-block">
          RESO Sistemas S.A. de C.V.
        </a>
      </div>
    </form>
  </div>

  <script>
    function IniciaSesion(e) {
      if (e) e.preventDefault();
      const usr = document.getElementById('usuario').value.trim() || 'user';
      localStorage.setItem('cv_usuario', usr);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
