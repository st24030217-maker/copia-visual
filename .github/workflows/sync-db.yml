name: Sync Live MySQL Database Snapshot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-mysql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring

      - name: Pull latest data from MySQL (162.240.213.3 / new_dentusradm_datos)
        run: php Backend/sync_snapshot.php

      - name: Commit and push updated snapshot
        run: |
          git config user.name "DentLab Live Sync Bot"
          git config user.email "sync-bot@dentlab.mx"
          git add Backend/db_snapshot.json
          git diff --staged --quiet || (git commit -m "chore(db): sync live MySQL snapshot from 162.240.213.3" && git push origin main)
